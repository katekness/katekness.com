<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Girl, Listen: Body Check-In</title>
<meta name="theme-color" content="#fbf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Girl, Listen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ee;--card:#fffdf9;--navy:#1f2c5f;--body:#4f5577;--line:#ece3d6;--pink:#c2456f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--navy);font-family:"Open Sans",Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
p,h1,h2{margin:0}
.lab{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.gl{font-family:Gloock,Georgia,serif;font-weight:400}
.pf{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
header .lab{color:var(--pink)}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;min-height:44px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px;min-height:0;touch-action:pan-y}
.stage{position:relative;height:min(100%,640px);aspect-ratio:9/16;max-width:100%;perspective:1400px}
.card{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;border:0;padding:0;text-align:left;width:100%;height:100%}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:clamp(22px,7%,34px);display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(31,44,95,.13)}
.front{align-items:center;gap:8px}
.front .art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.front img{max-width:86%;max-height:100%;object-fit:contain}
.front .hint{font-size:12px;color:var(--body)}
.back{transform:rotateY(180deg);background:var(--card);border:1px solid var(--line);gap:12px;overflow:auto}
.back h2{font-size:clamp(22px,6.6vw,28px);line-height:1.1}
.back .body p{font-size:clamp(14px,4vw,16px);line-height:1.55;margin-bottom:10px}
.notice{border-radius:16px;padding:13px 15px;margin-top:auto}
.notice p+p{margin-top:4px;font-size:15px;font-weight:600;line-height:1.35}
.sign{text-align:right;color:var(--body);font-size:15px}
.swipe-out-left{transform:translateX(-120%) rotate(-8deg)!important;opacity:0}
.swipe-out-right{transform:translateX(120%) rotate(8deg)!important;opacity:0}
.stage.dragging .card{transition:none}
.stage .card.anim{transition:transform .3s ease,opacity .3s ease}
nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px 18px}
.round{width:52px;height:52px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.round svg{width:22px;height:22px}
.flipbtn{min-width:120px;height:52px;border-radius:999px;background:var(--navy);color:var(--paper);font-weight:700;font-size:15px}
.fav.on svg path{fill:var(--pink);stroke:var(--pink)}
.sheet{position:fixed;inset:0;background:rgba(31,44,95,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.panel{background:var(--paper);width:100%;max-width:560px;max-height:82dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.panel h1{font-size:28px;margin-bottom:4px}
.panel .sub{color:var(--body);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid button{border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
.grid img{height:84px;width:auto;object-fit:contain}
.grid span{font-size:12px;font-weight:600;line-height:1.3;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button[aria-pressed=true]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.empty{color:var(--body);font-size:14px;padding:12px 0}
.welcome{position:fixed;inset:0;background:var(--paper);z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px;gap:18px}
.welcome.open{display:flex}
.welcome img{width:190px}
.welcome h1{font-size:40px;line-height:1.05}
.welcome p{max-width:340px;font-size:16px;line-height:1.55}
.go{background:var(--navy);color:var(--paper);border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;min-height:52px}
.tip{font-size:13px;color:var(--body);max-width:320px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.card,.stage .card.anim{transition:none}}
</style>
</head>
<body>
<header>
<p class="lab">Girl, Listen</p>
<button class="pill" id="openMenu" aria-haspopup="dialog">All moments</button>
</header>
<main id="main">
<div class="stage" id="stage">
<button class="card" id="card" aria-live="polite">
<div class="face front" id="front"></div>
<div class="face back" id="back"></div>
</button>
</div>
</main>
<nav aria-label="Card controls">
<button class="round" id="prev" aria-label="Previous card"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2c5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="round fav" id="fav" aria-label="Save to favorites" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2c5f" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
<button class="flipbtn" id="flip">Flip it</button>
<button class="round" id="shuffle" aria-label="Pick a random card"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2c5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
<button class="round" id="next" aria-label="Next card"><svg viewBox="0 0 24 24" fill="none" stroke="#1f2c5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
<div class="panel">
<h1 class="gl" id="sheetTitle">Pick your moment</h1>
<p class="sub">No order. No streaks. Whatever's happening right now.</p>
<div class="tabs"><button class="pill" id="tabAll" aria-pressed="true">All</button><button class="pill" id="tabFav" aria-pressed="false">Favorites</button><button class="pill" id="closeMenu" style="margin-left:auto">Close</button></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" hidden>Tap the heart on a card and it'll live here.</p>
</div>
</div>

<div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle">
<img src="img/phone.webp" alt="">
<h1 class="gl" id="wTitle">Girl, listen.</h1>
<p>It's me. Your fascia. Pick a card when the moment shows up. Flip it. Notice one thing. That's the whole assignment.</p>
<button class="go" id="start">Show me a card</button>
<p class="tip" id="tip"></p>
</div>

<script>
const PINK=['#fde6ee','#c2456f'],SUN=['#fff5d6','#9a720a'],GREEN=['#e9f2e6','#3e7a4e'],BLUE=['#e6eaf6','#3b4fa0'];
const CARDS=[
['laptop','Before you open the laptop',SUN,'phone','The body has entered the chat.',["Before the tabs open and everyone needs something: roll call.","Shoulders? Jaw? Breath, are you here or still in your inbox?","Just checking who showed up today."],"Which part of you is already working, and the day hasn't started?"],
['meeting','In the meeting',BLUE,'queen','Shoulders down, queen.',["Your shoulders are in full power-blazer mode. Nobody asked them to clock in. They volunteered.","Very loyal. Very '80s.","The meeting will survive without them up by your ears."],'Where are your shoulders right now?'],
['focus','Deep in focus',PINK,'clam','Unclench your jaw.',["It's an email, not a walnut.","Your jaw clocks stress before you do. It's always first in the group chat with “yep, that tracks.”","I know you're busy making pearls under pressure, but come on."],'Were your teeth touching?'],
['slump','The 2pm slump',BLUE,'hydrate','Hydrate your fascia.',["Yes, drink the water. Plot twist: I hydrate when you move. Squeeze and release, like a sponge.","Three hours in one chair is a dry sponge situation.","Reach. Twist. Roll your ankles under the desk. I'll take it."],"What part of you hasn't moved in a while?"],
['text','When a text lands wrong',SUN,'opinions','My body has opinions.',["You said “it's fine.” Your chest disagreed. Your stomach is already drafting a reply.","I can't tell you what the text meant.","I can tell you the group chat is blowing up."],'Where did you feel it before you decided how you felt?'],
['standing','Standing up after sitting too long',BLUE,'hips','My hips remember everything.',["Your hips clocked every minute in that chair.","Those creaky first few steps? That's me, getting everyone moving again.","Give it a second. We'll get there."],'What loosened first?'],
['lunch','Eating standing up',GREEN,'lunch','Lunch is a sit-down affair.',["You're eating over the counter like a raccoon on a deadline.","Sitting down for lunch doesn't need a permission slip.","Stomach wants to know: are we in trouble, or just hungry?"],'What changes in your belly when you sit?'],
['bed','One more message before bed',GREEN,'notnow',"Not now, I'm being a body.",["That message can wait until morning.","So can the one you were about to answer in the bathroom.","Nothing good gets decided at 11pm with your thumbs."],'What did your shoulders do when you put the phone down?'],
['grip','Holding on too tight',SUN,'grip','Loosen your grip.',["Steering wheel. Coffee mug. Phone. The whole week.","Your hands are gripping like someone's about to take it.","Nobody's taking it. Try a two out of ten."],'How hard were you holding on?'],
['door','Walking in the door',PINK,'unclenching','Currently unclenching.',["Door closes. Bag drops. Shoulders drop with it.","You didn't decide to relax. The room told me it was safe to.","Let it happen. No need to supervise."],'What let go without you asking?'],
['convo','After the hard conversation',BLUE,'tension','Tension has entered the chat.',["Brows were doing social math. Neck was scanning the room.","Jaw is still drafting comebacks for a conversation that already ended.","It's over. And jaw? You know what the clam would say."],'Which part of you is still in that conversation?'],
['lights','Lights out',GREEN,'dnd','Do not disturb.',["You've been sleeping light, half-listening, just in case. I kept that setting because it helped once.","Nobody's on call tonight. The group chat is muted.","Go to sleep."],"Where's the last place in your body to settle?"],
['reset','Bonus: the corner office reset',SUN,'space','Take up space.',["Hands behind your head, like you're about to kick your feet up in the corner office. Stay sitting tall.","Without moving your head, look as far left as your eyes go. Breathe. Wait for a sigh, a yawn or a swallow.","Then look right. Same thing."],'What did your body say? A yawn counts.','Eyes only. Skip it if you feel dizzy.']
];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=store.get('gl-favs',[]);
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function byHour(){const h=new Date().getHours();
 if(h<10)return 'laptop'; if(h<12)return 'meeting'; if(h<13)return 'lunch'; if(h<14)return 'focus'; if(h<16)return 'slump'; if(h<18)return 'grip'; if(h<20)return 'door'; if(h<22)return 'bed'; return 'lights';}
let i=Math.max(0,CARDS.findIndex(c=>c[0]===byHour()));
let flipped=false;
function render(){
 const [id,moment,[wash,acc],img,line,body,notice,sign]=CARDS[i];
 $('front').style.background=wash;
 $('front').innerHTML=`<p class="lab" style="color:${acc};text-align:center">${esc(moment)}</p><div class="art"><img src="img/${img}.webp" alt="Sticker: ${esc(line)}"></div><p class="pf" style="color:#4f5577;font-size:16px">Girl, listen.</p><p class="hint">Tap to flip</p>`;
 $('back').innerHTML=`<p class="lab" style="color:${acc}">${esc(moment)}</p><h2 class="gl">${esc(line)}</h2><div class="body">${body.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="notice" style="background:${wash}"><p class="lab" style="color:${acc}">Notice</p><p>${esc(notice)}</p></div><p class="pf sign">${esc(sign||'Still here, Fascia')}</p>`;
 setFlip(false);
 const on=favs.includes(id); $('fav').classList.toggle('on',on); $('fav').setAttribute('aria-pressed',on); $('fav').setAttribute('aria-label',on?'Remove from favorites':'Save to favorites');
 $('card').setAttribute('aria-label',`${moment}. ${line}. Tap to flip.`);
}
function setFlip(v){flipped=v;$('card').classList.toggle('flipped',v);$('flip').textContent=v?'Flip back':'Flip it';}
function go(dir){
 const c=$('card');c.classList.add('anim',dir>0?'swipe-out-left':'swipe-out-right');
 setTimeout(()=>{c.classList.remove('anim','swipe-out-left','swipe-out-right');c.style.transform='';i=(i+dir+CARDS.length)%CARDS.length;render();},260);
}
$('card').onclick=()=>{if(!moved)setFlip(!flipped)};
$('flip').onclick=()=>setFlip(!flipped);
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
$('shuffle').onclick=()=>{let n;do{n=Math.floor(Math.random()*CARDS.length)}while(n===i);const d=n-i;i=n-1;go(1);};
$('fav').onclick=()=>{const id=CARDS[i][0];favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];store.set('gl-favs',favs);render();setFlip(flipped)};
// swipe
let sx=0,sy=0,dx=0,moved=false,down=false;
const st=$('stage');
st.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;});
st.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-sy)){moved=true;st.classList.add('dragging');$('card').style.transform=`translateX(${dx}px) rotate(${dx/30}deg)${flipped?' rotateY(180deg)':''}`;}});
const end=()=>{if(!down)return;down=false;st.classList.remove('dragging');if(moved&&Math.abs(dx)>70){go(dx<0?1:-1)}else{$('card').style.transform='';}setTimeout(()=>moved=false,0);};
st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);st.addEventListener('pointerleave',end);
document.addEventListener('keydown',e=>{if($('sheet').classList.contains('open')||$('welcome').classList.contains('open')){if(e.key==='Escape')closeMenu();return;}if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
// menu
let tab='all';
function fillGrid(){
 const list=CARDS.map((c,n)=>[c,n]).filter(([c])=>tab==='all'||favs.includes(c[0]));
 $('grid').innerHTML=list.map(([c,n])=>`<button data-n="${n}" style="background:${c[2][0]}"><img src="img/${c[3]}.webp" alt=""><span>${esc(c[1])}</span></button>`).join('');
 $('empty').hidden=list.length>0;
 $('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{i=+b.dataset.n;render();closeMenu();});
}
function openMenu(){fillGrid();$('sheet').classList.add('open');$('closeMenu').focus();}
function closeMenu(){$('sheet').classList.remove('open');$('openMenu').focus();}
$('openMenu').onclick=openMenu;$('closeMenu').onclick=closeMenu;
$('sheet').onclick=e=>{if(e.target.id==='sheet')closeMenu()};
$('tabAll').onclick=()=>{tab='all';$('tabAll').setAttribute('aria-pressed',true);$('tabFav').setAttribute('aria-pressed',false);fillGrid()};
$('tabFav').onclick=()=>{tab='fav';$('tabFav').setAttribute('aria-pressed',true);$('tabAll').setAttribute('aria-pressed',false);fillGrid()};
// welcome
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!store.get('gl-seen',false)){$('welcome').classList.add('open');
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(!standalone)$('tip').textContent=ios?'Tip: tap Share, then “Add to Home Screen,” and I’ll live on your phone like an app.':'Tip: use your browser menu to “Add to Home screen” (or Install), and I’ll live on your phone like an app.';}
$('start').onclick=()=>{store.set('gl-seen',true);$('welcome').classList.remove('open');};
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
